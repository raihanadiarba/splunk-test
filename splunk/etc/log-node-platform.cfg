# =============================================================================
# log-node-platform.cfg
# =============================================================================
# This file controls the logging behavior for the splunk-supervisor process
# and all sidecars managed by the node-platform layer.
# Subprocess log files (sup-pkg-<package-name>-<subprocess-name>*.log) 
# follow the same settings as their parent sidecar.
#
# SCOPE: This file ONLY affects supervisor and its managed packages.
#   It does NOT affect splunkd logging (which is controlled by log.cfg).
#   Global settings defined here (before any stanza) apply only within
#   this file's scope — they do not carry over to log.cfg or any other
#   logging configuration file.
#
# IMPORTANT: To customize these settings:
#   1. Create an empty file: $SPLUNK_HOME/etc/log-node-platform-local.cfg
#   2. Add ONLY the settings you want to override in the local file
#   3. Settings in local file take precedence over this default file
#
# This approach ensures you receive updated defaults during Splunk upgrades
# while preserving your customizations in the local file.
#
# A restart of Splunk is required for changes to take effect.
#
# LIMITATIONS:
#   - Only rootAppender is supported (no custom appenders)
#   - fileName is not supported (log paths are fixed by supervisor)
#   - ConversionPattern is not supported (format is fixed)
# =============================================================================
# =============================================================================
# QUICK START GUIDE
# =============================================================================
#
# Common Use Cases:
#
# 1. Increase log retention for all components:
#    Set appender.rootAppender.maxFileSize and appender.rootAppender.maxBackupIndex
#    in the global section (before any stanza)
#
# 2. Enable debug logging for supervisor only:
#    Add [supervisor] stanza with rootCategory = DEBUG,rootAppender
#
# 3. Increase logs for a specific sidecar (e.g., identity):
#    Add [identity] stanza with appender.rootAppender.maxFileSize = 100MB
#
# 4. Set custom number of days to retain old log files for a specific sidecar
#    and its subprocesses managed by splunk-supervisor (e.g., postgres):
#    Add [postgres] stanza with appender.rootAppender.maxAge = 12days
#
# 5. Disable compression to save CPU:
#    Set appender.rootAppender.compressionFormat = none in global section
#
# =============================================================================
# =============================================================================
# LOG FILE LOCATIONS
# =============================================================================
# Supervisor log files:
#   $SPLUNK_HOME/var/log/splunk/supervisor.log        (main supervisor log)
#   $SPLUNK_HOME/var/log/splunk/supervisor-start.log  (supervisor startup log)
#     NOTE: supervisor-start.log uses the [supervisor] stanza configuration
#           (or global defaults if no [supervisor] stanza is defined)
#
# Package log files (stderr):
#   $SPLUNK_HOME/var/log/splunk/sup-pkg-<package-name>.log
#
# Package stdout log files:
#   $SPLUNK_HOME/var/log/splunk/sup-pkg-<package-name>-stdout.log
#
# Subprocess log files (stderr):
#   $SPLUNK_HOME/var/log/splunk/sup-pkg-<package-name>-<subprocess-name>.log
#
# Subprocess stdout log files:
#   $SPLUNK_HOME/var/log/splunk/sup-pkg-<package-name>-<subprocess-name>-stdout.log
#
# Rotated log files are named with timestamp suffix and compressed:
#   <basename>-YYYY-MM-DDTHH-MM-SS.mmm.log.gz
#   Example: supervisor-2024-12-09T14-30-22.456.log.gz
# =============================================================================
# =============================================================================
# CONFIGURATION HIERARCHY
# =============================================================================
# Settings are applied in this priority order:
#   1. Process-specific stanza ([supervisor] or [<package-name>])
#   2. Global defaults (settings before any stanza)
#   3. Hardcoded fallbacks
#
# This means you can set global defaults and only override specific processes.
# =============================================================================
# -----------------------------------------------------------------------------
# Global Defaults
# -----------------------------------------------------------------------------
# These settings apply to ALL processes (supervisor and sidecars) unless
# explicitly overridden by a process-specific stanza below.
# Minimum log level to record, with appender reference.
# Options: DEBUG (most verbose), INFO, WARN, ERROR (least verbose)
# Default: INFO
# Note: Use DEBUG for troubleshooting, INFO for normal operation
rootCategory = INFO,rootAppender
# Maximum size of a log file before it is rotated.
# Min: 1MB | Default: 50MB
appender.rootAppender.maxFileSize = 50MB
# Number of rotated log files to retain. Older files are deleted.
# Default: 15 - keeps up to 15 rotated files (16 total including current)
# Example: With 50MB files, max disk usage = 50MB * 16 = 800MB per component
appender.rootAppender.maxBackupIndex = 15
# Maximum number of days to retain log files.
# Files older than this are deleted regardless of maxBackupIndex.
# Min: 1 day | Default: 28 days
appender.rootAppender.maxAge = 28days
# Compression format for rotated log files. Set to 'none' to deactivate compression.
# Default: gz (compressed using gzip)
appender.rootAppender.compressionFormat = gz
# -----------------------------------------------------------------------------
# Process-Specific Overrides (Optional)
# -----------------------------------------------------------------------------
# Add stanzas to override settings for specific processes.
# Use the process name as the stanza name, for example, [supervisor], [postgres].
# Include only settings you want to change from global defaults.
#
# [supervisor]
# rootCategory = DEBUG,rootAppender
# appender.rootAppender.maxFileSize = 100MB
#
# [postgres]
# rootCategory = DEBUG,rootAppender
# appender.rootAppender.maxFileSize = 500MB
# appender.rootAppender.maxBackupIndex = 10
#
# [agentmanager]
# rootCategory = INFO,rootAppender
#
# -----------------------------------------------------------------------------
# Known Limitations
# -----------------------------------------------------------------------------
# The 'rootCategory' setting used to configure log level is currently
# not supported for the following processes.
# Configuring it in their stanzas will have no effect on the log verbosity.
#
#   - edge
#   - opamp-svc
#   - edge-processor-config
#
# All other settings (maxFileSize, maxBackupIndex, maxAge, compressionFormat)
# are fully supported for these processes.
# -----------------------------------------------------------------------------
