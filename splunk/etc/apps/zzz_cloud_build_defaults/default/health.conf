#
# Cloud build default values for health.conf
#
# These settings were migrated from @ifdef WITH_CLOUD blocks in
# cfg/bundles/default/health.conf.in as part of the multi-presence project.
#

[noah]
disabled = 1
noah_server_request_interval = 60

[feature:noah_server]
display_name = Noah Server
indicator:restart_in_progress:description = This indicator tracks whether a restart of any Noah indexer is in progress.
indicator:restart_in_progress:yellow = 1
indicator:restart_in_progress:red = 2

[feature:noah_indexers]
display_name = Noah Indexers
indicator:indexers_available:description = This indicator tracks whether there are indexers available for indexing and searching.
indicator:indexers_available:yellow = 1
indicator:indexers_available:red = 2
indicator:data_searchable:description = This indicator tracks whether all data is searchable.
indicator:data_searchable:yellow = 1
indicator:data_searchable:red = 2

[data_management_health_reporter]
disabled = 1

