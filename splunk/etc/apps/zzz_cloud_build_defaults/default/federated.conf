#
# Cloud build default values for federated.conf
#
# FS-S3 providers and indexes become read-only, and 'sdselect' on them is blocked.
# FS-ASL ('aws_lake') indexes keep full CRUD but allow 'sdselect' only when
# compiled from SPL2. FS-SAL ('aws_s3_sal') is unrestricted.
# See federated.conf.spec for the rule format and the full list of actions.
#

[general]
legacy_aws_federated_provider_support = aws_s3:list|delete,aws_s3_sal:*,aws_lake:*
legacy_aws_federated_index_support = aws_s3:list|delete,aws_s3_sal:*,aws_lake:create|edit|list|delete|search_spl2_only
