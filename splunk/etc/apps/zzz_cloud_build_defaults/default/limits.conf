#
# Cloud build default values for limits.conf
#
# These settings were migrated from @ifdef WITH_CLOUD blocks in
# cfg/bundles/default/limits.conf.in as part of the multi-presence project.
#

[search]
async_quota_update = true
async_quota_update_freq = 30
# Specifies whether the Splunk software reruns all or elements of a currently
# running realtime search process when there are changes in the indexing tier
search_retry_realtime = true
# Specifies if CPU telemetry is being collected.
enable_cpu_telemetry = true
# The length of time, in seconds, that search artifacts generated by async
# replication or downloaded from remote storage persist on search head cluster
# members that did not originally run the search.
shc_cached_artifacts_ttl = 86400

[email]
enforce_limits          = 0
max_recipients          = -1
validation              = basic


[join]
support_multiple_data_sources = false


[inputproc]
# Disable all modular and scripted inputs.
disable_inputs = false

# When "disable_inputs = true": Modular and scripted inputs with the
# following sourcetypes continue running by default.
always_on_input_sourcetypes =

[auth]
# THIS IS AN INTERNAL SETTING.
# NOTE: Do not change this setting unless instructed to do so by Splunk Support.
# Specifies the maximum number of policies allowed for each capability.
scoped_capability_max_policies = 100
# THIS IS AN INTERNAL SETTING.
# NOTE: Do not change this setting unless instructed to do so by Splunk Support.
# Specifies the maximum number of conditions allowed for each policy.
policy_max_conditions = 2
# THIS IS AN INTERNAL SETTING.
# NOTE: Do not change this setting unless instructed to do so by Splunk Support.
# Specifies the maximum number of values allowed for each policy condition.
policy_max_condition_values = 100
# THIS IS AN INTERNAL SETTING.
# NOTE: Do not change this setting unless instructed to do so by Splunk Support.
# Specifies the comma-separated attributes that are allowed in a policy.
policy_allowed_attributes = o11y::organization::*,datasets::entity::*,connections::entity::*,session::user::*,promotions::entity::*
# THIS IS AN INTERNAL SETTING.
# NOTE: Do not change this setting unless instructed to do so by Splunk Support.
# Specifies the comma-separated capabilities that are allowed to have policies.
policy_allowed_capabilities = o11y_*,*_datasets,*_connections,search,*_promotions,promote_datasets_*

[uistate]
disabled  = true

kvservice.read_timeout_ms = 500
kvservice.write_timeout_ms = 500
kvservice.connect_timeout_ms = 500

[structured_data_service]
s3_connect_timeout_ms = 1000
s3_request_timeout_ms = 3000
max_splunk_managed_database_tables = 1000

[sdselect]
reuse_search_results_default = true
reuse_search_results_max_age_in_minutes = 1440
query_fetch_size_mb = 10
query_fetch_max_threads = 5
query_status_check_ms = 500
max_mem_usage_mb = 500
maxresultrows = 50000
max_number_of_results = 100000

[federated_analytics]
service_connect_timeout = 10
service_read_timeout = 120
service_write_timeout = 120
max_number_of_results = 100000
results_download_bufsize_mb = 256

[ingest_actions]
rfsFSDestinationOff = true

[searchresults2]
eval = false
mvcombine = false
mvexpand = false
sort = false
block_split_check_freq = 100

[inputlookup]
inputlookup_cursor = false
