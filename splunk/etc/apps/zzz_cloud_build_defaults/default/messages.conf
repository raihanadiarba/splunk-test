#
# Cloud build default values for messages.conf
#
# These settings were migrated from @ifdef WITH_CLOUD blocks in
# cfg/bundles/default/messages.conf.in as part of the multi-presence project.
#

#############################################################################
# Handlers: /src/search/processors/FederatedAnalyticsProcessor.cpp
#############################################################################
[FA]
name        = Federated Analytics

[FA:MISSING_ARGUMENT__S]
message      = Missing required argument: '%s'.
action       = Contact Splunk Support.
severity     = error

[FA:INVALID_ARGUMENT__S]
message      = Invalid argument: '%s'.
action       = Contact Splunk Support.
severity     = error

[FA:DISPATCH_FAILED__S]
message      = Failed to dispatch query: '%s'.
action       = Try to run the search again. If the problem persists, contact Splunk Support.
severity     = error

[FA:STATUS_FAILED]
message      = Failed to run federated search.
action       = Try to run the search again. If the problem persists, contact Splunk Support.
severity     = error

[FA:RESULTS_FAILED__S]
message      = Failed to get query results: '%s'.
action       = Try to run the search again. If the problem persists, contact Splunk Support.
severity     = error

[FA:UNKNOWN_MESSAGE__S]
message      = Unknown message '%s' was returned.
action       = For more information, select the search.log link in the Job Inspector report for your search. If the error persists and is preventing you from running this search, contact Splunk Support.
severity     = error

[FA:UNKNOWN_MESSAGE__S_S]
message      = Unknown message '%s' was returned: %s.
action       = For more information, select the search.log link in the Job Inspector report for your search. If the error persists and is preventing you from running this search, contact Splunk Support.
severity     = error

[FA:QUERY_TIMEOUT__S]
message      = The search timed out before it could complete: %s.
action       = Rewrite the search to limit the scope of data it scans, and run it again. If you continue to experience timeout issues, contact Splunk Support.
severity     = error

[FA:QUERY_CANCELED_BY_USER]
message      = The search was canceled.
severity     = warn

[FA:QUERY_CANCELED_BY_SYSTEM]
message      = The search was canceled due to a system issue.
action       = Try to run the search again. If you continue to experience system cancellation issues, contact Splunk Support.
severity     = error

[FA:BYTES_SCANNED_LIMIT__S]
message      = Bytes scanned limit exceeded: %s.
action       = Rewrite your search to reduce the amount of data that it scans, and run it again.
severity     = error

[FA:RESULTS_LIMIT_REACHED__S]
message      = Too many result rows were returned by this search. The results have been automatically truncated: %s.
severity     = warn

[FA:TOO_MANY_QUERIES_CANCELED]
message      = Too many searches are running concurrently. Search was canceled.
action       = Wait for a moment and rerun the search.
severity     = error

[FA:TOO_MANY_QUERIES_QUEUED]
message      = Too many searches are running concurrently.
action       = Waiting for search to start.
severity     = warn

[FA:LONG_RUNNING_QUERY]
message      = Processing results may take longer than usual.
severity     = warn

[FA:UNSUPPORTED_FUNCTION__S]
message      = The search contains unsupported functions: %s.
action       = Remove the functions or replace the functions with supported ones. Then rerun the search.
severity     = error

[FA:SCHEMA_MISMATCH__S]
message      = Detected data type mismatch: %s.
action       = Verify that the defined schema matches the table definition. Confirm schema compatibility with the data producer.
severity     = error

[FA:UNSUPPORTED_SCHEMA_TYPE__S]
message      = Detected unsupported data type: %s.
action       = The data type for this field is currently not supported by the Splunk platform or the dataset source. Remove fields that are of unsupported data types from your search.
severity     = error

[FA:CANNOT_ACCESS_RESOURCE__S]
message      = Cannot perform action: %s.
action       = Determine whether the catalog and corresponding data exists, and verify that its access authorization methods have been correctly configured.
severity     = error

[FA:QUERY_PREPARATION_FAILED]
message      = An error occurred during search preparation.
action       = Review the syntax of your search and the dataset you are trying to search. Check the Job Inspector for details after you run the search. If you cannot resolve the issue, contact Splunk Support.
severity     = error

[FA:QUERY_EXECUTION_FAILED]
message      = An error occurred during search execution.
action       = Check the Job Inspector for details after you run the search. If you cannot resolve the issue contact Splunk support.
severity     = error

[FA:JOB_IN_PROVISIONING]
message      = Resources are being provisioned for your search. Provisioning can take a few minutes.
severity     = warn

[FA:JOB_NOT_ACCESSIBLE]
message      = Resources cannot be provisioned for your search at this time.
action       = Try again later.
severity     = error

[FA:DATASET_IN_CREATION__S]
message      = Dataset is still being created: %s.
action       = Wait until the dataset is created before searching it. Dataset creation can take a few minutes.
severity     = error

[FA:DATASET_CREATION_FAILED__S]
message      = Dataset creation failed: %s.
action       = Verify the dataset configuration in the Data Management app. If you cannot resolve this error, contact Splunk support.
severity     = error

[FA:DATASET_NOT_FOUND__S]
message      = Dataset definition cannot be found: %s.
action       = In the Data Managment app, verify that the dataset exists, confirm that its name is spelled correctly, and ensure that you have permission to access it.
severity     = error

[FA:QUERY_REUSE_RESULTS]
message      = The results from the last successful search were reused.
severity     = warn

[FA:UNSUPPORTED_FEATURE__S]
message      = This feature is not supported by the Splunk platform: %s.
action       = Turn off the feature, or rollback to supported version, then try to run search again. If you cannot resolve the issue, contact Splunk Support.
severity     = error

[FA:GLACIER_FILES_INCLUDED]
message      = Some files are in GLACIER or DEEP_ARCHIVE storage class and may not be accessible. Results may be incomplete if those files have not been temporarily restored.
severity     = warn

[FA:MDL_RAW_SEARCHED]
message      = Search is currently on an MDL Raw dataset.
action       = For an optimized search experience, consider promoting the dataset to MDL Lakehouse Promoted.
severity     = info

[FA:LEGACY_DATASET_SEARCHED]
message      = Your federated search is running over a federated index.
action       = Federated indexes will be deprecated in an upcoming release. Migrate your federated index to a dataset in the Data Management app, and run your federated searches over that dataset instead.
severity     = warn

[QUARANTINED_LOOKUPS:UNHEALTHY_INDICATOR_TIP]
message      = To resolve this issue, either move large lookups to KV store or reduce their size by tuning the searches that populate them to generate fewer events. For details on quarantined lookups, including lookup size, lookup name, and cluster member, see the Cloud Monitoring Console under Settings in Splunk Web. For more information on quarantined CSV lookups, see the documentation.
