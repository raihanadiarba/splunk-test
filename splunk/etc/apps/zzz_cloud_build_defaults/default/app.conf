#
# Splunk app configuration file
#

[install]
state = disabled
is_configured = 1
allows_disable = false

[ui]
is_visible = False
label = Cloud Build Defaults

[launcher]
author = Splunk Cloud
description = Default configuration values for Splunk Cloud deployments, migrated from WITH_CLOUD build flags.
version = 1.0.0

[triggers]
reload.props               = access_endpoints /admin/transforms-reload, /admin/metrics-reload, /admin/metric-schema-reload, /data/datalake/ingest
reload.inputs              = access_endpoints /data/inputs/monitor, /data/inputs/script, /data/inputs/udp, /data/inputs/tcp/raw, /data/inputs/tcp/cooked, /data/inputs/http /data/datalake/ingest
reload.inputs.remote_queue = access_endpoints /data/datalake/ingest

