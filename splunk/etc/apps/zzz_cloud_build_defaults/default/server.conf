#
# Cloud build default values for server.conf
#
# These settings were migrated from @ifdef WITH_CLOUD blocks in
# cfg/bundles/default/server.conf.in as part of the multi-presence project.
#
# This app's default/ directory sits at etc/apps/cloud_build_defaults/default/,
# which is above etc/system/default/ but below any local/ configs written by
# Puppet or hiera in control-repo.
#

[general]
sessionRevalidateUserConfigTimeout = 5
sessionUserCacheSize = 200
workaround.cloud_specific.SPL-191293.include.ui-prefs = true
# Always include the patch number in the version string on Splunk Cloud.
display_version_with_patch = true

[sslConfig]
caTrustStorePath = /etc/ssl/certs/ca-certificates.crt

[applicationsManagement]
app_inspect_endpoint = https://appinspect.splunk.com/v1
app_inspect_auth_endpoint = https://api.splunk.com/2.0/rest/login/splunk
app_inspect_vetted_endpoint_timeout = 20
checkCloudVetting = false
checkCloudVettingForDomain = splunkbase.splunk.com
reservedAppsIds = 000-self-service, 075-cloudworks, cloud_administration, data_manager, dmc, launcher, sample_app, search, journald_input, SplunkDeploymentServerConfig, 100-cloudworks-wlm, splunk_gdi, 100-whisper, learned, splunk_httpinput, 100-whisper-common, legacy, splunk_instance_monitoring, 100-whisper-searchhead, prometheus, splunk_instrumentation, alert_logevent, splunk_internal_metrics, alert_webhook, appsbrowser, scsaudit, splunk_rapid_diag, search_artifacts_helper, splunk_secure_gateway, splunk_app_for_splunk_o11y_cloud, splunk-visual-exporter, dynamic-data-self-storage-app, splunkclouduf, tos, introspection_generator_addon, splunk-dashboard-studio, user-prefs, splunk-data-management, splunk_pipeline_builders
caTrustStorePath = /etc/ssl/certs/ca-certificates.crt

[queue]
autoAdjustQueue = true


[prometheus]
disabled = true
denyList = splunkd_bundle_replication_*,\
           splunkd_early_repair_*,\
           splunkd_smartbus_indexer_*,\
           splunkd_smartbus_ingestor_*,\
           splunkd_tcpin_connections_*,\
           splunkd_kvstore_sync_*
# Specify if auth components emit prometheus metrics
enable_auth_metrics=true

[config_change_tracker]
disabled = true

[search_state]
sslVerifyServerCert = false
sslVerifyServerName = false


[heartbeatService:noah]
timeout.connect = 3
timeout.read = 3
timeout.write = 3
# Set schedPolicy to fifo to get as predictable scheduling for noah heartbeat thread
# as possible.
# The priority is chosen such that it lies in the middle of the range, giving other
# higher priority RT threads a chance to run as well.
schedPolicy = fifo
schedPriority = 11

[structured_data_service]
server.acs_api.environment = prod
server.acs_api.version = v2
server.sslVerifyServerCert = false
server.sslVerifyServerName = false
server.managed_glue_logsources=cloudtrail,vpcflow

[teleport_supervisor]
enable_splunk_spotlight = true

[postgres]
disabled = true

[cluster_state_server]
disabled = true

[kvstore]
setFullyQualifiedHostName = true
defaultKVStoreType = local
postgresMigrateOnStartup = false
cloudMigration = true
upgradeVersion = false
externalKVStoreCollectionsSyncEnabled = true
externalKVStoreCollectionsSyncPeriod = 5
ocspValidation = false

[scs]
kvservice.auth.mode = external
scsTokenScriptPath = /usr/local/bin/get_scs_tokens.sh

