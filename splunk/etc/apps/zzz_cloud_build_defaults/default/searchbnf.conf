#
# Cloud build default values for searchbnf.conf
#
# These settings were migrated from @ifdef WITH_CLOUD blocks in
# cfg/bundles/default/searchbnf.conf.in as part of the multi-presence project.
#

##################
# sdselect
##################
[sdselect-command]
syntax = sdselect (<stats-func>(<field>)? (as <string:renamed-field>)?)+ (FROM <string:dataset>)? (WHERE <logical-expression>)? (GROUPBY <field>+ (span=<string:timespan>)? (reuse_search_results=<bool>) )? (ORDERBY <field>+ (ASC|DESC)? )? (LIMIT <int>)?
shortdesc = Performs statistics or projections on fields in a Federated Search for Amazon S3 search.
description = Performs statistics or simple projections on fields in a Federated Search for Amazon S3 search, \
              which searches a specific type of federated index that you can configure in indexes.conf as well as Splunk Web. \
              The 'sdselect' command is a generating command. The maximum number of results returned by 'sdselect' is \
              controlled by the 'LIMIT' clause if the clause is present in the search or by the 'max_number_of_results' setting \
              in limits.conf if the 'LIMIT' clause is absent. By default, the 'max_number_of_results' is 100,000.
related = tstats, stats, from
category = reporting, results::filtering
tags = sdselect sds
example1 = | sdselect count FROM mydata
comment1 = Gets the count of all events in the mydata dataset.
example2 = | sdselect count(scan_count), sum(scan_count) FROM mydata GROUPBY '_time', host SPAN=1d
comment2 = Gets the count and sum of the 'scan_count' field in the 'mydata' dataset, grouping results by the '_time' and 'host' fields, and with a day granularity.
example3 = | sdselect '_time', sid, action, 'scan_count' FROM mydata WHERE user="tom"
comment3 = Gets the '_time', 'sid', 'action', and 'scan_count' fields in events where 'user="tom"' in the 'mydata' datset.
example4 = | sdselect count(scan_count) FROM mydata GROUPBY sid,action ORDERBY sid
comment4 = Gets a count of the 'scan_count' field, grouping counts by values of the 'sid' and 'action' fields, and ordering by values of the 'sid' field.
example5 = | sdselect count(scan_count) FROM mydata GROUPBY sid,action ORDERBY sid LIMIT 10
comment5 = Gets a count of the 'scan_count' field, grouping counts by values of the 'sid' and 'action' fields, and ordering by values of the 'sid' field, returns the first 10 results.
example6 = | sdselect count(audit.scan_count) FROM mydata
comment6 = Gets a count of the 'scan_count' member field nested within struct type field named 'audit'.
usage = public
