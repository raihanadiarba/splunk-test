#
# Cloud build default values for web.conf
#
# These settings were migrated from @ifdef WITH_CLOUD blocks in
# cfg/bundles/default/web.conf.in as part of the multi-presence project.
#

[remoteUI]
# Remote skinny app settings
remoteRoot = https://core-ae.scs.splunk.com
stack_id =

[admin_config_ui]
ip_allow_list = true
webhook_allow_list = true
limits_conf = true

[expose:authentication_oauth2-consents]
methods = GET,POST
pattern = authentication/oauth2-consents

[expose:authentication_cisco_identity]
methods = GET,POST
pattern = authentication/cisco_identity

[expose:authentication_crosslaunch]
methods = POST
pattern = authentication/crosslaunch

[expose:authentication_splunk_oauth_clients]
methods = GET,POST
pattern = authentication/splunk-oauth-clients

[expose:authentication_splunk_oauth_clients_ELEMENT]
methods = GET,POST,DELETE
pattern = authentication/splunk-oauth-clients/*

[expose:authentication_splunk_oauth_clients_rotate_secret]
methods = POST
pattern = authentication/splunk-oauth-clients/*/rotate-secret

[expose:authentication_oidc_configuration]
methods = GET,POST
pattern = authentication/oidc-configuration

[expose:authentication_oidc_configuration_ELEMENT]
methods = GET,POST,DELETE
pattern = authentication/oidc-configuration/*

[expose:authentication_oidc_configuration_keys]
methods = GET
pattern = authentication/oidc-configuration/*/keys

[expose:authentication_oidc_configuration_rotate_keys]
methods = POST
pattern = authentication/oidc-configuration/*/rotate-keys

[expose:authentication_oidc_configuration_status]
methods = POST
pattern = authentication/oidc-configuration/*/status

[expose:authentication_oidc_role_mapping]
methods = GET,POST
pattern = authentication/oidc-role-mapping

[expose:authentication_oidc_role_mapping_ELEMENT]
methods = GET,POST,DELETE
pattern = authentication/oidc-role-mapping/*

[expose:authorization_policies]
methods = POST,GET
pattern = authorization/policies

[expose:authorization_policies_ELEMENT]
methods = GET,DELETE,POST
pattern = authorization/policies/*

[expose:authorization_eval_context]
methods = POST
pattern = authorization/eval-context
