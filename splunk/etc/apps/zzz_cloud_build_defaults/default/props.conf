#
# Cloud build default values for props.conf
#
# These settings were migrated from @ifdef WITH_CLOUD blocks in
# cfg/bundles/default/props.conf.in as part of the multi-presence project.
#

[default]
unarchive_cmd_start_mode = direct

[splunkd]
TRUNCATE = 75000

[splunk_python]
TRUNCATE = 75000

[search_log]
MAX_TIMESTAMP_LOOKAHEAD = 40
TIME_FORMAT = %m-%d-%Y %H:%M:%S.%l %z
SHOULD_LINEMERGE = false
TRUNCATE = 20000
EXTRACT-message = \] - (?<message>.*)$
EXTRACT-fields = (?i)^(?:[^ ]* ){2}(?:[+\-]\d+ )?(?P<log_level>[^ ]*)\s+(?P<component>[^ ]+) \[(?P<thread_no>\d+) (?P<thread>[^\]]+)\] -

[splunkd_remote_searches]
TRUNCATE = 100000

[splunk_audit]
TRUNCATE = 20000

[splunkd_access]
TRUNCATE = 75000

[splunkd_ui_access]
TRUNCATE = 75000

[splunkd_conf]
TRUNCATE = 75000
