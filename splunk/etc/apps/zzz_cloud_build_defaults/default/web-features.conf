#
# Cloud build default values for web-features.conf
#
# These settings were migrated from @ifdef WITH_CLOUD blocks in
# cfg/bundles/default/web-features.conf.in as part of the multi-presence project.
#

[feature:new_search_experience]

# Determines whether or not to display the new Search and Dashboard Experience preview to admins.
enable_new_search_admin = true

# Determines whether or not to display the new Search and Dashboard Experience preview to users.
enable_new_search_user = false

[feature:new_data_management_experience]

# Determines whether or not to display the link to the new Data Management Experience.
enable_new_data_management_link = true

[feature:manager_xml_pages]

# Determines whether the 'element_overlay' query parameter in Splunk Web is enabled or disabled.
# CAUTION: Do not change this setting unless instructed to do so by Splunk Support.
enable_element_overlay_usage = false

[feature:ip_allowlist]
# Determines whether Splunk Web allows IPv6 address inputs in forms.
enable_ipv6_validations = true

[feature:dynamic_feature_flagging]
# Determines whether or not a Splunk Cloud Platform deployment receives dynamic
# user interface updates.
enable_dynamic_ui_updates = true

# URL of the content delivery network (CDN) from which newly released user interface updates are downloaded.
feature_flag_service_url = dff.splunk.com

[feature:federated_search]
# Determines whether Splunk Web displays the modern Amazon S3 workflow
enable_s3_modernization = true

[feature:pendo]
# Determines whether or not Pendo telemetry integration is enabled in Splunk web.
enable_pendo = true
