#
# Cloud build default values for restmap.conf
#
# These settings were migrated from @ifdef WITH_CLOUD blocks in
# cfg/bundles/default/restmap.conf.in as part of the multi-presence project.
#
[global]
blockRetiredConfigHandlers = true

[admin:certificates]
authKeyStanza=noahService

# read scs tenant config info from server.conf
[admin:tenantinfo]
match=/server/scs/tenantinfo

[admin:dist-handlers]
members=distsearch-setup:config,distsearch-peer:peers,distsearch-group:groups,search-head-bundles:bundle-replication-files,noahbucket:bucketmap

[admin:authentication_group]
members = auth-tokens,users,httpauth-tokens,token-keys,users:changepassword,current-context,internal-oauth-clients,cisco_identity,splunk-oauth-clients,oauth2-consents,crosslaunch,oidc-configuration,oidc-role-mapping
