# This file creates roles and sets granular access controls.

# These stanzas list all the dmc capabilities

# Access to the /apps endpoint and the /deploy endpoint
[capability::dmc_deploy_apps]

# Access to the /topologies endpoint
[capability::dmc_manage_topology]

# Access to the /config endpoint
[capability::dmc_deploy_token_http]


################################################################
################################################################
[role_admin]
dmc_deploy_apps = enabled

dmc_manage_topology = enabled

dmc_deploy_token_http = enabled

