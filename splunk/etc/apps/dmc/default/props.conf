[dmc_agent]
MAX_TIMESTAMP_LOOKAHEAD = 40

[dmc_agent_access]
maxDist = 28
MAX_TIMESTAMP_LOOKAHEAD = 128
REPORT-access = access-extractions
SHOULD_LINEMERGE = False
TIME_PREFIX = \[
EXTRACT-extract_spent = \s(?<spent>\d+(\.\d+)?)ms$

[source::.../var/log/splunk/dmc_agent_access(-\d+)?.log(.\d+)?]
sourcetype = dmc_agent_access

[source::.../var/log/splunk/dmc_agent(-\d+)?.log(.\d+)?]
sourcetype = dmc_agent
