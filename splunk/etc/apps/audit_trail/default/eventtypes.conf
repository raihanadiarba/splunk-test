# Mapping between Audit Trail v2 format and Splunk CIM
[cim:audit_account]
search = index=_audit sourcetype=audittrailv2* category=system data.type=account

[cim:audit_system]
search = index=_audit sourcetype=audittrailv2* category=system NOT data.type=account

[cim:audit_object]
search = index=_audit sourcetype=audittrailv2* category=object

[cim:authentication]
search = index=_audit sourcetype=audittrailv2* category=authn
