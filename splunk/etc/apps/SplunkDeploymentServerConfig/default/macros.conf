#   Version 10.6.1.1

[filter_by_client_id(1)]
args = clientId
definition = if ("$clientId$" != "", "data.clientId = $clientId$", "")
iseval = 1
validation = isStr($clientId$)

[filter_by_app(1)]
args = appName
definition = if ("$appName$" != "", "data.appName = $appName$", "")
iseval = 1
validation = isStr($appName$)

[filter_by_action(1)]
args = action
definition = if ("$action$" != "", "data.action = $action$", "")
iseval = 1
validation = isStr($action$)

[filter_by_checksum(1)]
args = checksum
definition = if ($checksum$ > 0, "data.checksum = $checksum$", "")
iseval = 1
validation = isNum($checksum$)

[filter_by_error(1)]
args = has_error
definition = if ("$has_error$" = "true",\
  "data.result != Ok",\
  if ("$has_error$" = "false",\
    "data.result = Ok",\
    ""\
  )\
)
iseval = 1
validation = isStr($has_error$)

[filter_by_app_count(1)]
args = has_app_filter
definition = if ("$has_app_filter$" = "true", "countApps > 0", "")
iseval = 1
validation = isStr($has_app_filter$)

[filter_by_phonehome(1)]
args = minPhoneHomeTime
definition = if ($minPhoneHomeTime$ > 0, "lastPhoneHomeTime >= $minPhoneHomeTime$", "")
iseval = 1
validation = isNum($minPhoneHomeTime$)

[filter_by_ratio(2)]
args = greater_than,ratio
definition = if ($ratio$ > 0, \
  if ("$greater_than$" = "true",\
    "actual_ratio > $ratio$",\
    "actual_ratio <= $ratio$"\
  ),\
  ""\
)
iseval = 1
validation = isStr($greater_than$) AND isNum($ratio$)

[lookup_filter_by_min_ph_time(1)]
args = minPhoneHomeTime
definition = "'lastPhoneHomeTime' >= $minPhoneHomeTime$"
iseval = 1
validation = isNum($minPhoneHomeTime$)

[lookup_filter_by_client_id(1)]
args = clientId
definition = "'clientId' = \"$clientId$\""
iseval = 1
validation = isStr($clientId$)

[lookup_filter_by_app_name(1)]
args = appName
definition = "'appName' = \"$appName$\""
iseval = 1
validation = isStr($appName$)

[lookup_filter_by_action(1)]
args = action
definition = "'action' = \"$action$\""
iseval = 1
validation = isStr($action$)

[lookup_filter_by_checksum(1)]
args = checksum
definition = "'checksum' = \"$checksum$\""
iseval = 1
validation = isNum($checksum$)

[lookup_filter_by_has_deployment_error(1)]
args = has_error
definition = if ("$has_error$" = "true",\
  "'result' = \"Error\"",\
  if ("$has_error$" = "false",\
    "'result' != \"Error\"",\
    ""\
  )\
)
iseval = 1
validation = isStr($has_error$)

[lookup_filter_by_app_count]
definition = "'countApps' > 0"
iseval = 1

[lookup_filter_by_max_ph_latency_ratio(1)]
args = ratio
definition = "'actual_ratio' <= $ratio$"
iseval = 1
validation = isNum($ratio$)

[lookup_filter_by_min_ph_latency_ratio(1)]
args = ratio
definition = "'actual_ratio' > $ratio$"
iseval = 1
validation = isNum($ratio$)

[lookup_paginate(2)]
args = from,to
definition = "| streamstats count as row_number | where 'row_number' > $from$ | where 'row_number' <= $to$"
iseval = 1
validation = isNum($from$) AND isNum($to$)

[lookup_sort_asc(1)]
args = key
definition = "| sort 0 $key$"
iseval = 1
validation = isStr($key$)

[lookup_sort_desc(1)]
args = key
definition = "| sort 0 - $key$"
iseval = 1
validation = isStr($key$)

[agents_lookup_overlap]
definition = "\"-10m\""
iseval = 1

[agents_lookup_max_clients]
definition = "75000"
iseval = 1

[agents_lookup_split_apps]
definition = eval appName = split(appName, "#") | eval serverClassName = split(serverClassName, "#") | eval action = split(action, "#") | eval result = split(result, "#") | eval failedReason = split(failedReason, "#") | eval checksum = split(checksum, "#") | eval timestamp = split(timestamp, "#")
iseval = 0

[agents_lookup_app_earliest]
definition = "-10d"
iseval = 1
