# The following SPLs are index versions of searches used by the AM sidecar.
# Unlike DeploymentServer* searches, AgentManager* saved searches don't have elevated limit for list function,
[AgentManagerFetchClients]
disabled = 0
search = | tstats prestats=t latest(data.lastPhoneHomeTime) values(data.lastPhoneHomeTime) where index=_dsphonehome earliest=$args.earliest$ latest=now by data.clientId \
| tstats prestats=t append=t latest(data.guid) latest(data.hostname) latest(data.mgmt) where index=_dsclient earliest=1 latest=now by data.clientId \
| stats latest(data.lastPhoneHomeTime) as lastPhoneHomeTime values(data.lastPhoneHomeTime) as allphs \
latest(data.guid) as data.guid latest(data.mgmt) as data.mgmt latest(data.hostname) as data.hostname by data.clientId \
| where lastPhoneHomeTime!="" \
| eval last4phs=mvindex(allphs,-4,-1) \
| eval oldestph=mvindex(last4phs,0) \
| eval newestph=mvindex(last4phs,-1) \
| eval deltacount=max(1,mvcount(last4phs)-1) \
| eval averagePhoneHomeInterval=floor((newestph-oldestph)/deltacount) \
| eval actual_ratio=(floor(time())-lastPhoneHomeTime)/averagePhoneHomeInterval \
| where actual_ratio < $args.ratio$ \
| fields data.mgmt data.hostname data.guid

