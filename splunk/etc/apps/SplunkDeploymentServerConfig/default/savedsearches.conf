# Since sorting is lexicographicall, allphs will break when sorting phonehomes before 
# and after the date: Saturday, 20 November 2286 17:46:40
# Because of difference in digits number
[DeploymentServerGetAgentsPhonehomes]
disabled = 0
action.webhook.enable_allowlist = 0
alert.track = 0
search = | tstats latest(data.lastPhoneHomeTime) as lastPhoneHomeTime values(data.lastPhoneHomeTime) as allphs\
latest(data.updaterRunning) as updaterRunning\
latest(_time) as _time\
where index=_dsphonehome earliest=$execTime$ latest=now lastPhoneHomeTime!="" by data.clientId\
| rename data.* as *\
| eval last4phs = mvindex(allphs, -4, -1)\
| eval last4phs = mvjoin(last4phs, "#")\
| append maxout=`agents_lookup_max_clients` [ | inputlookup agentsPhonehomes.csv ]\
| eval last4phs = split(last4phs, "#")\
| stats latest(lastPhoneHomeTime) as lastPhoneHomeTime values(last4phs) as last4phs\
latest(updaterRunning) as updaterRunning\
latest(_time) as _time\
by clientId\
| eval last4phs = mvindex(last4phs, -4, -1)\
| eval oldestph=mvindex(last4phs,0) \
| eval newestph=lastPhoneHomeTime \
| eval deltacount=max(1,mvcount(last4phs)-1) \
| eval averagePhoneHomeInterval=floor((newestph-oldestph)/deltacount) \
| eval actual_ratio=(floor(time())-lastPhoneHomeTime)/averagePhoneHomeInterval\
| eval last4phs = mvjoin(last4phs, "#")\
| fields clientId lastPhoneHomeTime averagePhoneHomeInterval actual_ratio last4phs updaterRunning _time\
| sort 0 - _time \
| outputlookup max=`agents_lookup_max_clients` createinapp=true override_if_empty=true agentsPhonehomes.csv\
| fields - last4phs

