[DeploymentServerCreateAgentsLookup]
disabled = 0
run_on_startup = true
# Make this search the second highest priority possible.
schedule_priority = highest
realtime_schedule = true
# Explicitly prevent skew (already a default behavior)
allow_skew = 0
# Explicitly prevent search from running more than once at the time (already a default behavior)
max_concurrent = 1
enableSched = 0
cron_schedule = */5 * * * *
description = A saved search that retrieves agents list and stores it in the lookup csv file.
search = | makeresults | eval currExecTime=1 | append [ | inputlookup agentsExecTime.csv | fields nextExecTime | rename nextExecTime as currExecTime ] \
| stats max(currExecTime) as currExecTime | eval currTime=now() | eval nextExecTime=round(relative_time(currTime, `agents_lookup_overlap`)) \
| outputlookup createinapp=true override_if_empty=true agentsExecTime.csv \
| eval maxAgents=`agents_lookup_max_clients`\
| map search="| savedsearch DeploymentServerGetAgentsPhonehomes execTime=$$currExecTime$$ | join type=left max=$$maxAgents$$ clientId [ | savedsearch DeploymentServerGetAgentsInfo execTime=$$currExecTime$$ ] | join type=left max=$$maxAgents$$ clientId [ | savedsearch DeploymentServerGetAgentsApps ]" maxsearches=1 \
| fields - currExecTime nextExecTime currTime maxAgents \
| sort 0 - _time \
| outputlookup max=`agents_lookup_max_clients` createinapp=true override_if_empty=true agents.csv

