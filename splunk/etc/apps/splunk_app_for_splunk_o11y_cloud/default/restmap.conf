[script:contact-sales]
match                 = /contact-sales
script                = sales/contact_sales.py
scripttype            = persist
handler               = contact_sales.ContactSales
python.version        = python3
python.required       = 3.13
output_modes          = json
passPayload           = true
capability            = read_o11y_content

[script:o11y-tokens]
match                 = /o11y-tokens
script                = config/o11y_token_service.py
scripttype            = persist
handler               = o11y_token_service.TokenService
python.version        = python3
python.required       = 3.13
output_modes          = json
passPayload           = true

# Scripted REST endpoints below forward to Splunk Observability Cloud using credentials stored for the app.
# passSystemAuth=true supplies a system-level Splunk token so this handler can read the shared O11y API
# token from storage/passwords. Access MUST be restricted via capability= so only intended Splunk users
# invoke these endpoints; granting wide roles without read_o11y_content continues to expose risk.
# Customers may set passSystemAuth=false so the caller's session token is used instead of the system token;
# those callers may be unable to read stored credentials unless Splunk ACLs allow it (see product docs).

[script:o11y-metric-timeseries]
match                 = /o11y-metrictimeseries
script                = proxy/o11y_metric_timeseries.py
scripttype            = persist
handler               = o11y_metric_timeseries.O11yMetricTimeSeries
python.version        = python3
python.required       = 3.13
output_modes          = json
passPayload           = true
passSystemAuth        = true
capability            = read_o11y_content

[script:o11y-config]
match                 = /o11y-config
script                = config/o11y_config.py
scripttype            = persist
handler               = o11y_config.O11yConfigHandler
python.version        = python3
python.required       = 3.13
output_modes          = json
passPayload           = true
passSystemAuth        = true
capability            = read_o11y_content

[script:http-proxy]
match                 = /o11y/*
script                = proxy/o11y_http_proxy.py
scripttype            = persist
handler               = o11y_http_proxy.O11yHttpProxy
python.version        = python3
python.required       = 3.13
output_modes          = json
passPayload           = true
passSystemAuth        = true
capability            = read_o11y_content

[script:o11y-chart-data]
match                 = /o11y-chart-data
script                = chart_data/chart_data_controller.py
scripttype            = persist
handler               = chart_data_controller.ChartDataController
python.version        = python3
python.required       = 3.13
output_modes          = json
passPayload           = true
passSystemAuth        = true
capability            = read_o11y_content

[script:csc-pairing]
# No capability= here: provisioning runs before any o11y org exists, so
# read_o11y_content/write_o11y_content don't apply yet. Authorization is
# instead enforced in code (CloudStackConfigHandler.handle_new_pairing) via
# util.o11y_utils.is_user_admin, which requires the Splunk admin/sc_admin role.
match                 = /csc-pairing
script                = config/cloud_stack_config.py
scripttype            = persist
handler               = cloud_stack_config.CloudStackConfigHandler
python.version        = python3
python.required       = 3.13
output_modes          = json
passPayload           = true
passSystemAuth        = true
