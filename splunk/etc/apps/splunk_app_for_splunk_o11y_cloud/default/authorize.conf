# the documentation located at
# https://help.splunk.com/en/splunk-enterprise/administer/admin-manual/9.4/administer-splunk-enterprise-with-configuration-files/about-configuration-files

#########################
##### CAPABILITIES #####
#########################
[capability::read_o11y_content]
disabled = 0

[capability::write_o11y_content]
disabled = 0

#########################
######## ROLES #########
#########################

[role_admin]
read_o11y_content = enabled
write_o11y_content = enabled

[role_power]
read_o11y_content = enabled
write_o11y_content = enabled

[role_user]
read_o11y_content = disabled
write_o11y_content = disabled
